[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-txt-mcp"
version = "0.1.0"
description = "MCP server for generating and managing llms.txt documentation files"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sandra Schipal", email = "sandra@sandraschi.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "aiofiles>=23.1.0",
    "pathspec>=0.11.0",
    "markdown>=3.5.0",
    "pyyaml>=6.0.0",
    "gitpython>=3.1.0",
    "typing-extensions>=4.0.0; python_version < '3.11'",
    "ruff>=0.15.2",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.14.5",
    "mypy>=1.0.0",
    "types-setuptools",
    "types-pyyaml",
    "types-markdown",
    "types-aiofiles",
    "types-psutil"
]

[project.urls]
Homepage = "https://github.com/sandraschi/llm-txt-mcp"
Documentation = "https://github.com/sandraschi/llm-txt-mcp#readme"
Issues = "https://github.com/sandraschi/llm-txt-mcp/issues"
Source = "https://github.com/sandraschi/llm-txt-mcp"

[project.scripts]
llm-txt-mcp = "llm_txt_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_txt_mcp", "llm_txt_mcp.*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["git.*", "pathspec.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W", "C90", "I", "N", "UP", "ANN", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLO", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "TD", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["ANN101", "ANN102", "D100", "D104", "S101", "G004", "PLR0913", "TRY003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "PLR", "TRY", "S105", "S106", "SLF001", "ARG002", "PLC0415"]
"server.py" = ["T20", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
